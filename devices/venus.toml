[device]
codename = "venus"
brand = "Xiaomi"
model = "Xiaomi 11"
ab = true
soc = { hans = "骁龙 888 移动平台", hant = "Snapdragon® 888 行動平台", en = "Snapdragon® 888 Mobile Platform" }
os_version_prop = "ro.mi.os.version.incremental"

[display]
# The system starts in the lower mode of the panel: 1080 by 2400 at 420.
width = 1080
height = 2400
density = 420
diagonal = 6.81

[modules]
sources = ["vendor_boot", "vendor_dlkm", "vendor"]
# The touchscreen: ST/FocalTech over SPI, with xiaomi_touch's own node and
# the goodix under-display fingerprint driver beside it.
load = ["xiaomi_touch", "fts_touch_spi_k2"]

# venus is a virtual A/B phone with no recovery partition of its own: its
# recovery ramdisk lives inside boot. The base here is the phone's own boot_a
# as it was dumped from the device, holding the TWRP recovery ramdisk its
# owner already runs (init, adbd, SELinux policy and libraries all present).
[stock]
version = "OS3.0.315.0.WPBCNXM+twrp"
image = "https://github.com/cvbyisme/skyward-venus/releases/download/stock-venus/stock-venus-boot.zip"
recovery = "7e8cbf08c9c87147de28f7a254e1e608fb4e6b2d9b9ef603111417195b0f58b3"
# The ramdisk is a third-party one (TWRP), which the packer refuses unless
# told to build on it anyway.
third_party = true
# The AVB footer names the partition the image fills, which is boot here.
partition = "boot"

[wlan]
# The kernel this phone runs has the WCN6855/QCA6390 driver built in: there is
# no module to load, and the driver comes up once the firmware is where it asks
# for it and its platform driver is told the filesystem is ready.
modules = []
writes = [{ path = "/sys/kernel/cnss/fs_ready", value = "1" }]
firmware = [
    { name = "wlan/qca_cld/qca6390/WCNSS_qcom_cfg.ini", path = "/vendor/etc/wifi/qca6390/WCNSS_qcom_cfg.ini" },
    { name = "wlan/qca_cld/qca6390/wlan_mac.bin", partition = "persist", path = "wlan_mac.bin" },
]
interface = "wlan0"
supplicant = "/vendor/bin/hw/wpa_supplicant"
libraries = ["/vendor/lib64", "/system/lib64"]
service = "android.hardware.wifi.supplicant.ISupplicant/default"
probe = "http://connect.rom.miui.com/generate_204"

[update]
server = "https://update.miui.com/updates/miotaV3.php"

# The settings partition the phone keeps its own small state in; the recovery
# mounts it where the phone does, as its bootloader hand-off is read there.
[partitions]
mounted = ["persist"]

# The secure world reaches back into Android through the listeners this
# daemon registers; without them the key service cannot use any key.
[[service]]
path = "/vendor/bin/qseecomd"
libraries = ["/system/lib64", "/vendor/lib64"]
ready_property = "vendor.sys.listeners.registered"
user = "root"
groups = ["root", "drmrpc"]

# The key service of the newer kind: the builds of this phone whose system is
# Android 13 keep their keys through this one instead, and it speaks over the
# ordinary binder rather than the hardware one. Its own program registers it,
# so it needs nothing else to be up first.
[[service]]
path = "/vendor/bin/hw/android.hardware.security.keymint-service-qti"
libraries = ["/system/lib64", "/vendor/lib64"]
ready_service = "android.hardware.security.keymint.IKeyMintDevice/default"
user = "system"
groups = ["system", "drmrpc"]

# The credential service of the same newer kind, which those builds keep
# beside it: it is what the secure world has check a screen lock.
[[service]]
path = "/vendor/bin/hw/android.hardware.gatekeeper-rust-service-qti"
libraries = ["/system/lib64", "/vendor/lib64"]
ready_service = "android.hardware.gatekeeper.IGatekeeper/default"
user = "system"
groups = ["system"]

# The directory the phone's hardware services of the older kind register
# with. A recovery carries none of it, so it is the installed system's own,
# which reads the descriptions in /vendor/etc/vintf.
[[service]]
path = "/mnt/system_ext/bin/hwservicemanager"
libraries = ["/mnt/system/system/lib64/bootstrap", "/mnt/system/system/lib64", "/mnt/system_ext/lib64"]
ready_property = "hwservicemanager.ready"
user = "system"
groups = ["system", "readproc"]

# The credential service: it is what the secure world has check a screen
# lock, and the only thing that can hand out the note the key service wants
# before it will use a key that secret guards.
[[service]]
path = "/vendor/bin/hw/android.hardware.gatekeeper@1.0-service-qti"
libraries = ["/system/lib64", "/vendor/lib64"]
ready_hardware_service = "android.hardware.gatekeeper@1.0::IGatekeeper/default"
user = "system"
groups = ["system"]

# The key service, which is the only thing that can use the keys the phone
# wrapped in hardware: the one that opens the data partition.
[[service]]
path = "/vendor/bin/hw/android.hardware.keymaster@4.1-service-qti"
libraries = ["/system/lib64", "/vendor/lib64"]
ready_hardware_service = "android.hardware.keymaster@4.1::IKeymasterDevice/default"
user = "system"
groups = ["system", "drmrpc"]

# The boot control, which says which slot the bootloader starts next and
# switches it, writing where the bootloader reads it. This phone's build of
# the hardware carries the older kind of it, at the version that came before
# the one that also tells where an update stands.
[[service]]
path = "/vendor/bin/hw/android.hardware.boot@1.1-service"
libraries = ["/system/lib64", "/vendor/lib64"]
ready_hardware_service = "android.hardware.boot@1.1::IBootControl/default"
user = "root"
groups = ["root"]
